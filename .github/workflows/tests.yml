name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26-intel  # Intel: the Apple-chip pool queues past GitHub's 15-minute limit

    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: make test-ci
